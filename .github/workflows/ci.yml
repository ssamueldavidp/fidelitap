name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  e2e:
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations + seed.sql)
        run: supabase start

      - name: Write .env.local
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          CRON_SECRET=ci-dummy-secret
          MP_ACCESS_TOKEN=TEST-dummy
          MP_PUBLIC_KEY=dummy
          RESEND_API_KEY=dummy
          VAPID_PUBLIC_KEY=dummy
          VAPID_PRIVATE_KEY=dummy
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=dummy
          UPSTASH_REDIS_REST_URL=https://dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN=dummy-token
          EOF

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for dev server
        run: npx --yes wait-on http://localhost:3000 -t 60000

      - name: Run e2e smoke test
        env:
          E2E_TEST_EMAIL: owner-pro@demo.co
          E2E_TEST_PASSWORD: Demo1234!
          E2E_TEST_CARD_SLUG: cafe-demo-pro
        run: pnpm test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
