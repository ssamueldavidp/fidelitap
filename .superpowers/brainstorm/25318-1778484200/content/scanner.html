<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FideliTap — Escanear Sello</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

  .page-wrap { width: 100%; max-width: 480px; }
  .logo { font-size: 20px; font-weight: 900; margin-bottom: 32px; text-align: center; }
  .logo span { color: #00C896; }

  /* Scanner card */
  .scanner-card { background: #1e293b; border-radius: 20px; border: 1px solid #334155; overflow: hidden; }

  .scanner-header { padding: 20px 24px 0; }
  .scanner-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .scanner-sub { font-size: 13px; color: #64748b; }

  /* Visor QR */
  .qr-viewer { margin: 20px 24px; background: #0a1020; border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .qr-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0a1020, #0f172a); }
  /* Esquinas del visor */
  .corner { position: absolute; width: 32px; height: 32px; border-color: #00C896; border-style: solid; }
  .corner-tl { top: 16px; left: 16px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
  .corner-tr { top: 16px; right: 16px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
  .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
  .corner-br { bottom: 16px; right: 16px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
  /* Línea de escaneo */
  .scan-line { position: absolute; left: 20px; right: 20px; height: 2px; background: linear-gradient(90deg, transparent, #00C896, transparent); border-radius: 1px; top: 40%; box-shadow: 0 0 12px rgba(0,200,150,0.6); animation: scanline 2s ease-in-out infinite; }
  @keyframes scanline { 0%, 100% { top: 25%; } 50% { top: 70%; } }

  /* Íconos de cámara centrados */
  .camera-icon { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .camera-icon svg { width: 48px; height: 48px; color: #334155; }
  .camera-text { font-size: 13px; color: #475569; }

  /* Divider */
  .divider { display: flex; align-items: center; gap: 12px; padding: 0 24px; margin: 4px 0; }
  .divider-line { flex: 1; height: 1px; background: #1e293b; }
  .divider-text { font-size: 12px; color: #475569; font-weight: 500; }

  /* Manual input */
  .manual-section { padding: 4px 24px 24px; }
  .manual-label { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
  .input-row { display: flex; gap: 10px; }
  .code-input { flex: 1; background: #0f172a; border: 1.5px solid #334155; border-radius: 10px; padding: 11px 14px; color: #f1f5f9; font-size: 14px; font-family: monospace; letter-spacing: 0.1em; outline: none; }
  .code-input:focus { border-color: #00C896; }
  .code-input::placeholder { color: #334155; font-family: monospace; }
  .submit-btn { padding: 11px 20px; background: #00C896; color: #0f172a; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }

  /* Success state */
  .success-card { background: #1e293b; border-radius: 20px; border: 1px solid #00C896; padding: 28px 24px; margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .success-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,200,150,0.15); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .success-title { font-size: 18px; font-weight: 800; color: #00C896; }
  .success-name { font-size: 15px; font-weight: 600; }
  .success-sub { font-size: 13px; color: #64748b; }

  /* Progress row */
  .progress-row { width: 100%; background: #0f172a; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; }
  .progress-lbl { font-size: 12px; color: #64748b; }
  .progress-val { font-size: 14px; font-weight: 800; }
  .progress-bar-bg { height: 8px; background: #1e293b; border-radius: 999px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #00C896; border-radius: 999px; transition: width 0.5s ease; }
  .stamps-row { display: flex; gap: 5px; }
  .stamp-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .stamp-dot.on { background: #00C896; }
  .stamp-dot.off { background: #1e293b; border: 1px solid #334155; }
  .stamp-dot.new { background: #00C896; box-shadow: 0 0 12px rgba(0,200,150,0.7); animation: pulse 1s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }

  .wallet-indicator { display: flex; align-items: center; gap: 8px; background: rgba(0,200,150,0.08); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #00C896; font-weight: 600; }

  /* Back link */
  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { font-size: 13px; color: #475569; cursor: pointer; }
  .back-link a:hover { color: #94a3b8; }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="logo">fideli<span>tap</span></div>

  <!-- Scanner card -->
  <div class="scanner-card">
    <div class="scanner-header">
      <div class="scanner-title">Escanear sello</div>
      <div class="scanner-sub">Apunta la cámara al QR de la tarjeta del cliente</div>
    </div>

    <div class="qr-viewer">
      <div class="qr-bg"></div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line"></div>
      <div class="camera-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <div class="camera-text">Cámara activa</div>
      </div>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">o ingresa el código</div>
      <div class="divider-line"></div>
    </div>

    <div class="manual-section">
      <div class="manual-label">Código único de la tarjeta</div>
      <div class="input-row">
        <input type="text" class="code-input" placeholder="CFE-A3X9..." value="">
        <button class="submit-btn">Dar sello</button>
      </div>
    </div>
  </div>

  <!-- Success state -->
  <div class="success-card">
    <div class="success-icon">✅</div>
    <div>
      <div class="success-title">¡Sello registrado!</div>
      <div class="success-name">Ana Martínez</div>
      <div class="success-sub">Café Central · hace un momento</div>
    </div>
    <div class="progress-row">
      <div class="progress-header">
        <span class="progress-lbl">Progreso</span>
        <span class="progress-val">6 / 10 sellos</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:60%"></div>
      </div>
      <div class="stamps-row">
        <div class="stamp-dot on">☕</div>
        <div class="stamp-dot on">☕</div>
        <div class="stamp-dot on">☕</div>
        <div class="stamp-dot on">☕</div>
        <div class="stamp-dot on">☕</div>
        <div class="stamp-dot new">☕</div>
        <div class="stamp-dot off"></div>
        <div class="stamp-dot off"></div>
        <div class="stamp-dot off"></div>
        <div class="stamp-dot off"></div>
      </div>
    </div>
    <div class="wallet-indicator">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Wallet actualizada ✓
    </div>
  </div>

  <div class="back-link"><a>← Volver al dashboard</a></div>
</div>

</body>
</html>
