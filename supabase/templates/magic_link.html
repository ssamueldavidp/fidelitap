<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;padding:28px 12px;background-color:#F4F6FA;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;color:#12161C">
    <div style="max-width:560px;margin:0 auto">
      <div style="padding:0 8px 20px;text-align:center">
        <a href="https://fidelitap.co" style="text-decoration:none">
          <img src="https://fidelitap.co/fidelitap-logo.png" alt="fidelitap" width="120" style="display:inline-block;height:auto;font-family:Outfit,Arial,sans-serif;font-weight:800;font-size:26px;color:#087A47">
        </a>
      </div>

      <div style="background-color:#087A47;background-image:linear-gradient(135deg,#0FB36A 0%,#087A47 55%,#055B35 100%);border-radius:28px 28px 0 0;padding:36px 32px 32px">
        <p style="margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#BFFFE0;font-family:Outfit,Arial,sans-serif">Verifica tu correo</p>
        <p style="margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF;font-family:Outfit,Arial,sans-serif">Tu código de verificación</p>
      </div>

      <div style="background-color:#FFFFFF;border:1px solid #E6EAF1;border-top:none;border-radius:0 0 28px 28px;padding:28px 32px 32px;text-align:center">
        <p style="margin:0 0 18px;font-size:16px;line-height:1.6;color:#5B6676">Escríbelo en la pantalla donde lo pediste:</p>
        <p style="margin:0 0 22px;display:inline-block;background-color:#E3F6EC;border-radius:20px;padding:16px 28px;font-size:38px;font-weight:800;letter-spacing:10px;color:#087A47;font-family:Outfit,Arial,sans-serif">{{ .Token }}</p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#5B6676">Dura 1 hora. Si no lo pediste tú, ignora este correo.</p>
      </div>

      <div style="padding:24px 12px 0;text-align:center">
        <p style="margin:0 0 6px;font-size:12px;color:#5B6676">Fidelitap · Tarjetas de fidelización digitales hechas en Colombia</p>
        <p style="margin:0;font-size:12px"><a href="https://fidelitap.co" style="color:#087A47;font-weight:700;text-decoration:none">fidelitap.co</a></p>
      </div>
    </div>
  </body>
</html>
